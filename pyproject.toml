[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-path-planning"
version = "1.0.0"
description = "RiskAwareDE: frozen experiments and reproducible figures for 3D path planning"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
